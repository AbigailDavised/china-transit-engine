name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (OIDC compatible npm >= 11.5.1)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dev dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build ESM and CJS targets
        run: npm run build

      - name: Publish with OIDC Provenance
        run: npm publish --provenance --access public
